name: customer-spending-trend-analysis-demo

# ML PoC for Reem Finance: UC-1 (Spending Trends), UC-2 (Churn), UC-3 (Fraud Detection)
# First run: 2-3 minutes (generates 1000 customers, 335k+ transactions, injects fraud patterns)
# Subsequent runs: ~10 seconds (database + models cached)

services:
  # Backend API Service (FastAPI + SQLAlchemy + ML models)
  # Endpoints: UC-1 trends/anomalies, UC-2 churn prediction, UC-3 fraud detection
  # Models ready for training: POST /api/ml/train-churn-model, POST /api/ml/train-fraud-model
  backend:
    build: ./backend
    container_name: spending-analysis-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./data/spending.db
      - LOG_LEVEL=INFO
      - PYTHONUNBUFFERED=1
      - MODEL_PATH=/app/data/models
      - TRAINING_N_CUSTOMERS=1000
      - DEMO_N_CUSTOMERS=22
    volumes:
      - ./backend/data:/app/data  # SQLite DB (auto-generated) + model artifacts (.pkl)
    networks:
      - ml-poc-network
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --access-log
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]  # Checks DB + model status
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 900s  # 15 minutes: DB generation + indexing on first run
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Frontend Application (Vue.js 3 + Tailwind CSS)
  # Dashboard with 3 tabs: UC-1 Trends | UC-2 Churn | UC-3 Fraud
  # Real-time predictions, interactive charts (ApexCharts), SHAP explanations
  frontend:
    build: ./frontend
    container_name: spending-analysis-frontend
    ports:
      - "3000:80"  # http://localhost:3000
    environment:
      - VITE_API_URL=http://localhost:8000  # Backend API URL
    depends_on:
      backend:
        condition: service_healthy  # Wait for backend health check
    networks:
      - ml-poc-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]  # Check nginx serving
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

networks:
  ml-poc-network:
    driver: bridge

volumes:
  backend-data:
    driver: local
